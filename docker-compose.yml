name: colonbyte-leads

services:
  server:
    build: ./server
    restart: unless-stopped
    # Dockerfile's CMD is `npm start` (production, for Render/Fly) — locally we want
    # `npm run dev`'s --watch so the bind-mounted source below actually hot-reloads.
    command: npm run dev
    # No local `mongo` service — real lead data lives in Atlas (server/.env's MONGODB_URI),
    # same as native `npm run dev`. A bundled local Mongo container here used to silently
    # override MONGODB_URI to a near-empty throwaway DB, which made the dashboard look like it
    # had lost hundreds of leads when they were actually untouched in Atlas the whole time.
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./leadforge
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_PROXY_TARGET: http://server:5000
    ports:
      - "3002:3002"
    volumes:
      - ./leadforge:/app
      - /app/node_modules
