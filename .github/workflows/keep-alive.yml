name: Keep Render instance warm

# Render's free tier sleeps the leadforge-server instance after ~15 min of no traffic, and the
# next request pays a 30-60s cold-start wake-up (Render's own generic loading screen) before
# anything renders. That request is exactly what happens when a real client clicks a demo link
# in an outreach email/WhatsApp message - so a cold instance turns "here's the site we built
# you" into a broken-looking screen for the first 30-60 seconds. Pinging the health endpoint
# every 10 minutes (under Render's 15-minute idle window) keeps it warm so real client clicks
# never hit a cold start.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 25 https://leadforge-server-kzk4.onrender.com/api/health
