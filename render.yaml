services:
  - type: web
    name: leadforge-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Set for real once you have them — Render prompts for these at blueprint deploy time
      # and stores them as secrets, never in this file.
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_WEBHOOK_PUBLIC_KEY
        sync: false
      # This service's actual assigned Render URL — outreach emails link here.
      - key: PUBLIC_BASE_URL
        value: https://leadforge-server-kzk4.onrender.com
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # The dashboard (leadforge/) stays local-only — this only needs to allow whatever
      # origin your browser actually loads the dashboard from.
      - key: CLIENT_ORIGIN
        value: http://localhost:3000
